<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧語音點餐 POS (WebGPU 本地版)</title>
    <!-- 強制破壞快取 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- 引入 WebLLM 最新穩定核心 -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
        window.webllm = webllm;
        window.dispatchEvent(new Event('webllm-ready'));
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 15px; max-width: 500px; margin: 0 auto; background: #f5f5f7; display: flex; flex-direction: column; min-height: 90vh; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .main-btn { width: 100%; min-height: 80px; padding: 15px; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; background: #0071e3; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,113,227,0.3); margin-bottom: 15px; word-break: break-all; }
        .main-btn:disabled { background: #86868b; box-shadow: none; cursor: not-allowed; }
        .main-btn.listening { background: #ff3b30; animation: pulse 1.5s infinite; box-shadow: 0 4px 15px rgba(255,59,48,0.4); }
        #status-text { color: #86868b; font-size: 14px; margin-bottom: 10px; font-weight: 500; }
        
        /* 即時語音顯示區 */
        .live-speech-box { background: #eef2ff; border: 1px dashed #6366f1; color: #3730a3; padding: 10px; border-radius: 10px; font-size: 14px; margin-bottom: 15px; min-height: 42px; text-align: left; word-break: break-all; }
        
        progress { width: 100%; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 15px; display: block; }
        .result-section { border-top: 2px dashed #e5e5ea; padding-top: 15px; margin-top: 10px; text-align: left; display: none; }
        .result-box { display: flex; justify-content: space-between; border-bottom: 1px solid #f2f2f7; padding: 8px 0; font-size: 16px; }
        .total { font-size: 22px; font-weight: bold; color: #ff3b30; text-align: right; margin-top: 15px; }
        
        /* 🛠️ 臨時除錯區塊 (Debug Area) */
        .debug-area { margin-top: 20px; background: #282c34; color: #61afef; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 12px; text-align: left; word-break: break-all; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .debug-title { color: #e5c07b; font-weight: bold; margin-bottom: 5px; font-family: sans-serif; display: flex; justify-content: space-between; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="card">
        <div id="status-text">⏳ 正在初始化 WebGPU 環境...</div>
        <progress id="download-progress" value="0" max="100"></progress>
        
        <!-- 🎙️ 即時語音文字顯示區 -->
        <div class="live-speech-box" id="speech-box">🗣️ 語音即時辨識：等待開始...</div>

        <button class="main-btn" id="action-btn" disabled>請稍候...</button>

        <div class="result-section" id="result-area">
            <p style="font-size: 16px;"><strong>顧客姓名：</strong> <span id="res-customer" style="color:#0071e3;">-</span></p>
            <h3 style="margin-top: 10px; margin-bottom: 5px; font-size: 16px; color:#1d1d1f;">點餐明細</h3>
            <div id="res-items"></div>
            <div class="total" id="res-total">總金額：$0</div>
        </div>

        <!-- 🛠️ 除錯區塊：查看 AI 輸出的原始 JSON -->
        <div class="debug-area">
            <div class="debug-title">
                <span>🔍 [除錯區] AI 原始輸出內容：</span>
            </div>
            <div id="debug-json">等待點餐解析...</div>
        </div>
    </div>

    <script>
        const CUSTOMER_DB = { "老黃": "黃大豪", "小陳": "陳小明", "阿民": "林國民" };
        const PRICE_DB = { "咖啡": 80, "紅茶": 30, "綠茶": 30, "蛋餅": 40 };

        let engine = null;
        let recognition = null;
        let isListening = false;
        let finalTranscript = "";
        
        const modelId = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC"; 

        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const speechBox = document.getElementById('speech-box');
        const progressEl = document.getElementById('download-progress');
        const resultArea = document.getElementById('result-area');
        const resCustomer = document.getElementById('res-customer');
        const resItems = document.getElementById('res-items');
        const resTotal = document.getElementById('res-total');
        const debugJson = document.getElementById('debug-json');

        async function initSystem() {
            try {
                if (!navigator.gpu) {
                    statusText.innerText = "❌ 瀏覽器不支援 WebGPU，請使用 Chrome/Edge 或 iOS 17+ Safari。";
                    actionBtn.innerText = "不支援此裝置硬體";
                    progressEl.style.display = "none";
                    return;
                }
                
                setupSpeech();

                statusText.innerText = "⏳ 正在初始化 WebLLM 引擎核心...";
                
                engine = await window.webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (report) => {
                        let percent = Math.round((report.progress || 0) * 100);
                        progressEl.value = percent; 
                        statusText.innerText = `🧠 AI 模型加載中... (${percent}%)`;
                        actionBtn.innerText = `讀取中 ${percent}%`;
                        
                        if (percent >= 100) {
                            progressEl.style.display = "none";
                        }
                    }
                });
                
                statusText.innerText = "✅ 本地 AI 點餐系統已就緒";
                actionBtn.innerText = "🎤 按一下 開始點餐";
                actionBtn.disabled = false;
            } catch (err) {
                console.error("Initialization Error:", err);
                statusText.innerText = "❌ 初始化失敗，請重刷網頁。";
                debugJson.innerText = "初始化錯誤: " + err.message;
                actionBtn.innerText = "系統錯誤";
            }
        }

        function setupSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusText.innerText = "⚠️ 瀏覽器不支援內建語音轉文字 API";
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = true; 
            recognition.continuous = true;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i].transcript;
                    } else {
                        interimTranscript += event.results[i].transcript;
                    }
                }
                const currentText = finalTranscript || interimTranscript;
                // 🗣️ 即時更新語音文字區塊
                speechBox.innerText = "🗣️ 說話內容：" + (currentText || "（聆聽中...）");
            };

            recognition.onerror = (err) => {
                console.warn("Speech Error:", err.error);
                if (err.error === 'not-allowed') {
                    alert("請允許網頁存取麥克風權限！");
                    stopListening();
                }
            };
        }

        actionBtn.addEventListener('click', () => {
            if (!isListening) {
                isListening = true;
                finalTranscript = "";
                actionBtn.innerText = "請說話...";
                actionBtn.classList.add('listening');
                statusText.innerText = "🔴 錄音中... 說完請再按一下按鈕。";
                speechBox.innerText = "🗣️ 說話內容：請開始說話...";
                resultArea.style.display = "none";
                debugJson.innerText = "等待 AI 回傳...";
                
                try { recognition.start(); } catch(e) {}
            } else {
                stopListening();
            }
        });

        async function stopListening() {
            isListening = false;
            actionBtn.classList.remove('listening');
            actionBtn.disabled = true;
            statusText.innerText = "🧠 本地 GPU AI 正在解析點餐資訊...";
            
            try { recognition.stop(); } catch(e) {}

            const textToProcess = finalTranscript.trim();
            if (!textToProcess) {
                statusText.innerText = "⚠️ 沒有偵測到語音，請再試一次。";
                actionBtn.innerText = "🎤 按一下 開始點餐";
                actionBtn.disabled = false;
                return;
            }

            await askLocalAI(textToProcess);
        }

        async function askLocalAI(text) {
            // 簡化系統 Prompt，給出更簡潔強烈的格式要求
            const systemPrompt = `Task: Extract ordered items from Chinese text into JSON.
Output MUST be pure JSON with no commentary.
Format:
{"customer":"name_or_unknown","items":[{"name":"item_name","count":1}]}

Example Input: 老黃要兩杯咖啡
Example Output: {"customer":"老黃","items":[{"name":"咖啡","count":2}]}`;

            try {
                const reply = await engine.chat.completions.create({
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: `Input: ${text}` }
                    ],
                    temperature: 0.1
                });

                // 取出 AI 的完整原始文字
                const rawOutput = reply.choices[0].message.content.trim();
                
                // 🔍 呈現原汁原味的 AI 回傳於除錯區塊
                debugJson.innerText = rawOutput;

                // 🛠️ 使用正則表達式只抓取第一個 {...} JSON 區塊
                const jsonMatch = rawOutput.match(/\{[\s\S]*\}/);
                
                if (jsonMatch) {
                    const parsedData = JSON.parse(jsonMatch[0]);
                    renderPOSResult(parsedData);
                } else {
                    throw new Error("模型回傳的文字中找不到標準 {} JSON 格式");
                }

            } catch (err) {
                console.error("AI Parsing Error:", err);
                statusText.innerText = "❌ 本地 AI 解析失敗，請看下方除錯區。";
            } finally {
                actionBtn.innerText = "🎤 按一下 開始點餐";
                actionBtn.disabled = false;
            }
        }

        function renderPOSResult(jsonData) {
            // 容錯機制：顧客 Key 可能是 customer / name
            const rawCust = jsonData.customer || jsonData.name || "未知";
            const realCust = CUSTOMER_DB[rawCust] || rawCust;
            resCustomer.innerText = `${realCust} (${rawCust})`;

            let html = "";
            let grandTotal = 0;

            if (jsonData.items && Array.isArray(jsonData.items)) {
                jsonData.items.forEach(item => {
                    const itemName = item.name || item.item || "未知品項";
                    // 容錯機制：數量 Key 可能是 count / qty / quantity
                    const count = Number(item.count || item.qty || item.quantity || 1);
                    const price = PRICE_DB[itemName] || 0;
                    const subtotal = price * count;
                    grandTotal += subtotal;

                    html += `
                        <div class="result-box">
                            <span>☕ ${itemName} x ${count}</span>
                            <span>小計: $${subtotal}</span>
                        </div>`;
                });
            }

            resItems.innerHTML = html;
            resTotal.innerText = `總金額：$${grandTotal}`;
            statusText.innerText = "✨ 結帳明細計算完畢！";
            resultArea.style.display = "block";
        }

        window.addEventListener('webllm-ready', () => {
            initSystem();
        });

        if (window.webllm) {
            initSystem();
        }
    </script>
</body>
</html>
