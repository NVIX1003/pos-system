<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地語音 POS 系統</title>
    <!-- 引入 WebLLM 瀏覽器本地 AI 核心 -->
    <script type="module">
        import * as webllm from "https://esm.run";
        window.webllm = webllm;
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f5f5f7; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-speech { background: #0071e3; color: white; }
        .btn-ai { background: #34c759; color: white; }
        #status { color: #86868b; font-size: 14px; margin-top: 5px; text-align: center; }
        pre { background: #f0f0f2; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 14px; }
        .result-box { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; }
        .total { font-size: 20px; font-weight: bold; color: #ff3b30; text-align: right; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎤 第一步：語音輸入</h2>
        <button class="btn-speech" id="start-speech">開始語音辨識</button>
        <p><strong>辨識結果：</strong> <span id="speech-text" style="color:#0071e3;">尚未輸入</span></p>
    </div>

    <div class="card">
        <h2>🧠 第二步：本地 AI 結構化提取</h2>
        <button class="btn-ai" id="run-ai" disabled>等待 AI 初始化...</button>
        <div id="status">正在載入 WebLLM 引擎...</div>
        <h3>AI 輸出的原始 JSON：</h3>
        <pre id="json-output">{}</pre>
    </div>

    <div class="card">
        <h2>💰 第三步：POS 資料庫對照結果</h2>
        <div id="pos-results">
            <p style="color:#86868b;">等待 AI 提取資料...</p>
        </div>
        <div class="total" id="pos-total">總金額：$0</div>
    </div>

    <script>
        // --- 模擬本地資料庫 ---
        const CUSTOMER_DB = { "老黃": "黃小名", "小陳": "陳大明" };
        const PRICE_DB = { "咖啡": 80, "紅茶": 30, "綠茶": 30, "蛋餅": 40 };

        let engine = null;
        // 使用 Qwen2.5-Coder-1.5B (WebLLM 內建支援網頁 WebGPU 執行的輕量首選)
        const modelId = "Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC"; 

        const startSpeechBtn = document.getElementById('start-speech');
        const runAiBtn = document.getElementById('run-ai');
        const speechTextEl = document.getElementById('speech-text');
        const jsonOutputEl = document.getElementById('json-output');
        const statusEl = document.getElementById('status');
        const posResultsEl = document.getElementById('pos-results');
        const posTotalEl = document.getElementById('pos-total');

        // --- 1. 初始化 WebLLM 本地 AI Engine ---
        async function initAI() {
            try {
                if (!navigator.gpu) {
                    statusEl.innerText = "❌ 您的瀏覽器不支援 WebGPU（請用 iOS 17+ Safari 或 Chrome 測試）";
                    return;
                }
                statusEl.innerText = "⏳ 正在初始化本地 AI 模型（首次載入需下載約 1GB 數據，隨後會快取在瀏覽器中）...";
                
                engine = await window.webllm.CreateEngine(modelId, {
                    initProgressCallback: (report) => {
                        statusEl.innerText = `模型載入中: ${Math.round(report.progress * 100)}% - ${report.text}`;
                    }
                });
                
                statusEl.innerText = "✅ 本地 AI 載入完成！隨時可以點餐。";
                runAiBtn.disabled = false;
            } catch (err) {
                statusEl.innerText = "❌ 載入失敗: " + err.message;
            }
        }

        // --- 2. 語音辨識 (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;

            startSpeechBtn.addEventListener('click', () => {
                recognition.start();
                statusEl.innerText = "🎤 聆聽中，請說話... (例如：老黃一杯咖啡，三杯紅茶)";
            });

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                speechTextEl.innerText = text;
                statusEl.innerText = "🗣️ 語音辨識成功！請點擊下方綠色按鈕交給 AI 處理。";
            };
        } else {
            startSpeechBtn.innerText = "不支援語音辨識 (請用 iPhone Safari)";
        }

        // --- 3. 呼叫本地 AI 進行 JSON 提取 ---
        runAiBtn.addEventListener('click', async () => {
            const inputText = speechTextEl.innerText;
            if (inputText === "尚未輸入") return;

            statusEl.innerText = "🧠 本地 AI 正在強力提取中（由手機 GPU 離線推論）...";
            runAiBtn.disabled = true;

            const systemPrompt = `You are a precise POS parser. Strictly obey these grammar alignment rules:
1. In Chinese ordering phrasing, numbers and units ALWAYS appear BEFORE the item name (e.g., "三杯紅茶" means 3 Black Tea). Never misalign them.
2. Output ONLY raw valid JSON, no markdown code block, no conversational words.
Format: {"customer": "name", "items": [{"name": "item", "count": integer}]}`;

            try {
                const reply = await engine.chat.completions.create({
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: Text: ${inputText} }
                    ],
                    temperature: 0.0 // 鎖定最低溫度，防止數量搞錯
                });

                const rawJsonText = reply.choices[0].message.content.trim();
                jsonOutputEl.innerText = rawJsonText;
                
                // --- 4. 解析 JSON 並對照資料庫計算金額 ---
                processOrder(JSON.parse(rawJsonText));
                statusEl.innerText = "✨ 點餐成功！金額已自動計算。";
            } catch (err) {
                statusEl.innerText = "❌ AI 處理出錯: " + err.message;
            } finally {
                runAiBtn.disabled = false;
            }
        });

        // --- 5. 處理訂單邏輯 (對照本地 DB) ---
        function processOrder(data) {
            const rawCustomer = data.customer || "未知顧客";
            // 查表：老黃 -> 黃叉叉
            const realCustomer = CUSTOMER_DB[rawCustomer] || rawCustomer; 
            
            let html = `<p><strong>實名顧客：</strong> ${realCustomer} (${rawCustomer})</p><h3>點餐明細：</h3>`;
            let totalSum = 0;

            if (data.items && Array.isArray(data.items)) {
                data.items.forEach(item => {
                    const price = PRICE_DB[item.name] || 0; // 查表：咖啡 -> 80 元
                    const subtotal = price * item.count;
                    totalSum += subtotal;
                    
                    html += `
                        <div class="result-box">
                            <span>☕ ${item.name} x ${item.count}</span>
                            <span>$${price}/杯 (小計: $${subtotal})</span>
                        </div>`;
                });
            }

            posResultsEl.innerHTML = html;
            posTotalEl.innerText = `總金額：$${totalSum}`;
        }

        // 頁面開啟時自動加載本地 AI
        window.addEventListener('load', initAI);
    </script>
</body>
</html>
